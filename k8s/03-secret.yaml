# =========================================================
#  Secret = tajne (ovdje: lozinka baze).
#  stringData -> upisujes obican tekst, Kubernetes ga sam base64-enkodira.
#
#  NAPOMENA O SIGURNOSTI:
#  - Ovaj fajl sadrzi tajnu u tekstu PA SE NE COMMITA na javni git.
#  - Za predaju: commitaj 03-secret.example.yaml (placeholder), a pravi
#    Secret kreiraj naredbom ili lokalnim fajlom koji je u .gitignore.
#  - Bolji pristup u praksi: Sealed Secrets / External Secrets / Vault.
#
#  Alternativa bez fajla (preporuceno za demo):
#    kubectl -n ticketing create secret generic ticketing-secret \
#      --from-literal=POSTGRES_PASSWORD='JakaLozinka123!'
# =========================================================
apiVersion: v1
kind: Secret
metadata:
  name: ticketing-secret
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change_me_in_prod"

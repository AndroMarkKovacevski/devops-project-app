# =========================================================
#  Worker - pozadinski potrosac reda. NEMA Service (ne slusa na portu)
#  i NEMA HTTP probe (nema endpointa).
#  Otpornost: ako proces padne (fatalna greska -> process.exit(1)),
#  Kubernetes ga automatski restarta (restartPolicy Always je default).
#  Opcionalno: heartbeat-file + exec livenessProbe (zahtijeva malu izmjenu koda).
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ticketing
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: ticketing-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: ticketing-platform
    spec:
      serviceAccountName: ticketing-sa
      containers:
        - name: worker
          image: image-registry.openshift-image-registry.svc:5000/ticketing/ticketing-worker:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: ticketing-config }
            - secretRef:    { name: ticketing-secret }
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits:   { cpu: "300m", memory: "192Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

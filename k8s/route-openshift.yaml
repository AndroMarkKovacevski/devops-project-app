# =========================================================
#  OpenShift ROUTE - koristi se UMJESTO Ingressa (10-ingress.yaml) na OpenShiftu.
#  NE primjenjuj oba; odaberi prema okruzenju.
#
#  Path routing na istom hostu (OpenShift Route podrzava 'path'):
#     /      -> frontend
#     /api   -> api
#
#  Host: zamijeni apps domenom svog klastera.
#    CRC (DO180):  *.apps-crc.testing
#    Primjer:      ticketing.apps-crc.testing
#  Uskladi API_BASE_URL u ConfigMapu:  http://ticketing.apps-crc.testing/api
# =========================================================
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-platform
spec:
  host: ticketing.apps-crc.testing     # <- UREDI
  path: /
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: 3000
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-platform
spec:
  host: ticketing.apps-crc.testing     # <- isti host kao frontend
  path: /api
  to:
    kind: Service
    name: api
    weight: 100
  port:
    targetPort: 8080
  wildcardPolicy: None

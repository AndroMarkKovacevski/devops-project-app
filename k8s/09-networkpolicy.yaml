# =========================================================
#  NetworkPolicy - segmentacija prometa (zero-trust unutar namespacea)
#  Strategija: prvo SVE zabrani (default-deny ingress), pa otvori tocno
#  ono sto treba. Najvazniji cilj: bazi i redisu smiju SAMO api i worker.
#
#  NAPOMENA: NetworkPolicy radi samo ako CNI plugin to podrzava
#  (Calico, Cilium, Weave...). minikube: pokreni s
#     minikube start --cni=calico
#  Inace se politike ignoriraju (sve prolazi).
# =========================================================

# 1) Default deny svega dolaznog u namespaceu
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ticketing
spec:
  podSelector: {}            # odnosi se na SVE podove
  policyTypes:
    - Ingress
  # nema 'ingress' pravila -> sav dolazni promet je zabranjen
---
# 2) Postgres prima SAMO od api i worker, na 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-postgres
  namespace: ticketing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: worker } }
      ports:
        - protocol: TCP
          port: 5432
---
# 3) Redis prima SAMO od api i worker, na 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-redis
  namespace: ticketing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: worker } }
      ports:
        - protocol: TCP
          port: 6379
---
# 4) API prima od frontend podova + izvana (Ingress controller) na 8080.
#    'from' izostavljen za vanjski pristup -> dozvoljeno sa svih izvora NA PORTU 8080.
#    (Opcionalno stroze: ogranici na namespace ingress kontrolera.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-api
  namespace: ticketing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# 5) Frontend prima izvana (Ingress controller) na 3000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-frontend
  namespace: ticketing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 3000

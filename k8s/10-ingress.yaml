# =========================================================
#  Ingress (KUBERNETES) - vanjski pristup.
#  Path routing na ISTOM hostu:
#     /      -> frontend:3000
#     /api   -> api:8080   (API interno skida "/api" prefiks)
#
#  PRIJE PRIMJENE:
#   1) Ukljuci ingress controller:  minikube addons enable ingress
#   2) Postavi 'host' na nesto rjesivo. Najlakse preko sslip.io/nip.io:
#        host: ticketing.<MINIKUBE_IP>.nip.io   (npr. ticketing.192.168.49.2.nip.io)
#      ILI dodaj u /etc/hosts:  <MINIKUBE_IP>  ticketing.local
#   3) Uskladi API_BASE_URL u 02-configmap.yaml s ovim hostom (+ "/api").
# =========================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing-ingress
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx        # minikube ingress addon koristi "nginx"
  rules:
    - host: ticketing.local      # <- UREDI
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

# =========================================================
#  PostgreSQL: init skripta (ConfigMap) + trajni disk (PVC) + Deployment + Service
# =========================================================

# --- init.sql kao ConfigMap (montira se u /docker-entrypoint-initdb.d) ---
# Izvrsava se SAMO pri prvoj inicijalizaciji prazne baze. Kreira ticket_orders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-platform
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS ticket_orders (
        id SERIAL PRIMARY KEY,
        order_id TEXT UNIQUE NOT NULL,
        event_id TEXT NOT NULL,
        customer_email TEXT NOT NULL,
        quantity INTEGER NOT NULL CHECK (quantity > 0),
        status TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_ticket_orders_created_at ON ticket_orders (created_at DESC);
---
# --- Trajni disk za podatke baze ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ticketing
  labels:
    app.kubernetes.io/part-of: ticketing-platform
spec:
  accessModes:
    - ReadWriteOnce        # jedan node pise -> dovoljno za jednu DB instancu
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard   # otkomentiraj/promijeni ako klaster trazi eksplicitnu klasu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ticketing
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ticketing-platform
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO disk: stari pod mora otpustiti volume prije novog
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ticketing-platform
    spec:
      serviceAccountName: ticketing-sa
      securityContext:
        fsGroup: 999          # postgres uid/gid u sluzbenoj slici -> moze pisati na PVC
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: ticketing-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: ticketing-secret, key: POSTGRES_PASSWORD }
            # Podaci u poddirektorij -> izbjegava problem s lost+found na nekim diskovima
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres            # ime = DNS koje api/worker koriste (POSTGRES_HOST)
  namespace: ticketing
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ticketing-platform
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
  # ClusterIP (default) -> dostupno samo unutar klastera. Baza se NE izlaze van.

# =========================================================
#  Redis (queue/cache). Bez trajnog diska - za lab je prihvatljivo da se
#  red isprazni pri restartu (worker ionako obradi sto stigne).
#  Za trajni red dodao bi se PVC + appendonly yes (nije nuzno za projekt).
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticketing
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ticketing-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: ticketing-platform
    spec:
      serviceAccountName: ticketing-sa
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
          
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ticketing
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ticketing-platform
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
